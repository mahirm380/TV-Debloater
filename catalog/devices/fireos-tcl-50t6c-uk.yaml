id: fireos-tcl-50t6c-uk
title: "TCL 50T6C-UK Fire TV"
contributors:
  - mahirm380
platform: fireos
status: partial
tested_on: "Fire OS 8 / Android 11, build RS8185.3885N, tested 2026-10-23"
models:
  - "TCL 50T6C-UK (AFTMA475B1, Fire TV Edition, UK)"
adb:
  port: 5555
  transport: wifi
  first_connection_prompt: "The owner presses Allow on the TV and selects Always allow"
developer_mode: "Settings > My Fire TV > About > press OK on the TV name 7 times > Developer Options > ADB debugging"
ip_location: "Settings > Network > select the connected Wi-Fi network"
prompts:
  - name: "ADB debugging authorization"
    blocks_automation: true
    fix: "The owner presses Allow on the TV and selects Always allow; continue only when adb devices says device"
data:
  packages: data/fireos/packages.txt
  protected: data/fireos/protected.txt
  never_disable: data/fireos/never-disable.txt
  user_apps: data/fireos/user-apps.txt
launcher:
  mechanism: accessibility_service
  package: tv.dumbtv.home
  reason: "Fire OS keeps Amazon Home protected; the tested Guard service hands HOME to dumbtv home without disabling the stock launcher"
  fallback: "./launcher/install.sh --undo"
  quirk: "The physical branded buttons launch vendor packages before a remap; the optional tcl-50t6c-uk profile handles the tested remote"
quirks:
  - "Fire OS identifies this television through an Amazon/TCL model string; publish the retail model only and never copy the longer HbbTV agent because it contains a hardware identifier"
  - "The tested remote reported scan codes 744 (Netflix), 745 (Prime Video) and 746 (Freely); these are not assumed for other TCL remotes"
  - "The Amazon Appstore opens through com.amazon.venezia's dedicated featured activity; launching the generic package can return to Amazon Home instead"
  - "PS5 was renamed and placed first in the inputs row; HDMI, Composite, tuner/Live TV and AirPlay remained available"
known_limits:
  - "The AirPlay tile is a front end for the receiver already built into this TV; it does not add an AirPlay receiver to other devices"
  - "Remote shortcut interception depends on the installed branded apps and exact remote firmware"
notes: >-
  The cleanup, DNS filter and launcher takeover were exercised; this report remains
  partial because a publishable verify.sh transcript was not retained. The Apple
  TV-inspired launcher was verified at 1920x1080 with app and input rows,
  Amazon Appstore, London weather, three built-in wallpapers, live slow pan, Plex,
  Spotify, Live TV, HDMI inputs and the optional remote-button profile.
verify:
  blocked: data/blocklists/verify-blocked.txt
  allowed: data/blocklists/verify-allowed.txt
